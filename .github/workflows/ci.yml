#định nghĩa quy trình thực thi cho tác vụ tự động
name: base CI pipline 

on:
  push:
    branches: ["main", "master", "test-branch"]
  pull_request:
    branches: ["main", "master"]

jobs:
  #job1: ghi log ra cmd tren ubuntu 
  log-job:
    name: log to screen
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v4
      - name: run log
        run: echo "Hello this is from GitHub Actions"

  #job2: chạy file index.js bằng node tren ubuntu
  run-js:
    name: Run javascript file
    runs-on: ubuntu-latest
    needs: log-job
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: setup nodejs
        uses: actions/setup-node@v4
        with: 
          node-version: '22'

      - name: Run index.js
        run: node index.js
    